services:
  mc:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    image: itzg/minecraft-server:java25
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
      # Simple Voice Chat (configured to use UDP on the game port)
      - "25565:25565/udp"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      # Pinned: this is a long-term world, bump deliberately after the mods support a new version
      VERSION: "26.3"
      FABRIC_LOADER_VERSION: "0.20.1"
      FABRIC_LAUNCHER_VERSION: "1.1.2"
      MEMORY: "16G"
      # MeowIce flags crash JDK 25 on this aarch64 (Ampere) host; Aikar G1 flags are safe
      USE_AIKAR_FLAGS: "true"
      TZ: "America/Los_Angeles"
      MOTD: "dacubeking SMP"
      DIFFICULTY: "hard"
      VIEW_DISTANCE: "12"
      SIMULATION_DISTANCE: "10"
      ENTITY_BROADCAST_RANGE_PERCENTAGE: "200"
      SPAWN_PROTECTION: "0"
      ALLOW_FLIGHT: "true"
      SYNC_CHUNK_WRITES: "false"
      ENABLE_WHITELIST: "true"
      ENFORCE_WHITELIST: "true"
      # No Chat Reports strips signatures server-side; don't require signed profiles
      ENFORCE_SECURE_PROFILE: "false"
      ANNOUNCE_PLAYER_ACHIEVEMENTS: "true"
      ENABLE_ROLLING_LOGS: "true"
      # All server-side; vanilla clients can join. Voxy (+ Voxy Server Side) and
      # Simple Voice Chat are optional client installs.
      # Every mod below is pinned to a Modrinth version ID, and dependencies are listed
      # explicitly, so a restart never updates anything. To update: audit the new
      # versions, then bump the IDs here deliberately.
      MODRINTH_DOWNLOAD_DEPENDENCIES: "none"
      # (Comments inside the list below must not contain commas; itzg splits on them.)
      MODRINTH_PROJECTS: |
        fabric-api:Zns5SSRA
        lithium:fWv5bnZk
        ferrite-core:d5ddUdiB
        krypton:UugdIYJw
        spark:e3hsPc1o
        chunky:86FKD9qx
        anti-xray:AU5FnTTj
        luckperms:DzQPkkXY
        no-chat-reports:6g96avt2
        universal-graves:r9hY06vQ
        # Voxy Server Side (streams Voxy LODs) is NOT listed here: ./mods holds a patched
        # 0.20.0 build with two fixes (tick crash, dimension-change lag). Re-add once upstream has both.
        simple-voice-chat:x9jLR94Q
        styled-chat:HQ91YnMY
        placeholder-api:lXytLqWj
        ledger:pxv5cN0d
        vanish:KgeCcJWw
        invview:uySsk7v8
        worldedit:ByRNkO83
        essential-commands:KANmt7ie
        # Per-subcommand permission nodes for vanilla commands (trusted: /whitelist add only)
        vanilla-permissions:bpq3ZDRl
        # /name prefix for everyone (shown in chat via %eclipsescustomname:prefix%)
        fabric-custom-names:4xw5Z2Sl
        bluemap:SX74rxzP
        # Worldgen (vanilla blocks only; removing later just leaves chunk borders)
        tectonic:tRBGDcCT
        terralith:aGE3hYAA
        nullscape:79OyFQtd
        amplified-nether:IYaFP7y8
        structory:GjOkOVW4
        towns-and-towers:vHZIKy6e
        dungeons-and-taverns:hn5CugpP
        # Dependencies of the mods above, pinned too (dependency auto-download is off)
        cloth-config:fg2uyxOW
        cristel-lib:rWxmPrGC
        fabric-language-kotlin:SKW1BTL3
        lithostitched:pZgI6b2t
        polymer:pA7tHJZE
      # The official VSS jar has the same filename Modrinth used; remove it so the
      # patched copy from ./mods is the only one loaded (Fabric refuses duplicate mod ids).
      # The glob also clears older patched builds, since /mods is copied in after.
      REMOVE_OLD_MODS: "true"
      REMOVE_OLD_MODS_INCLUDE: "voxy-server-side-fabric*.jar"
    volumes:
      - "./data:/data"
      # Local jars copied into /data/mods at startup (patched VSS; see mods/README.md)
      - "./mods:/mods:ro"
  # Exposes the BlueMap web map (mc:8100) through a Cloudflare Tunnel instead of a public port.
  # Public hostname -> http://mc:8100 is configured on the tunnel in the Cloudflare dashboard.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - mc
  restore-backup:
    profiles:
      - restore
    image: itzg/mc-backup
    restart: "no"
    # Call the native restic tool instead of a helper script
    entrypoint: restic
    # Tell it to restore the latest snapshot to the root directory
    command: restore latest --host minecraft-smp-server --target /
    environment:
      RESTIC_REPOSITORY: "s3:https://f5dbfc5cf299cd799bf49f258675f82b.r2.cloudflarest\
        orage.com/minecraft-backups"
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
    volumes:
      - ./data:/data
  backups:
    image: itzg/mc-backup
    # Without this the sidecar silently stayed dead after exiting in April 2026
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      mc:
        condition: service_healthy
    environment:
      NAME_WITH_VERSION: "true"
      BACKUP_INTERVAL: "6h"
      RCON_HOST: mc
      INITIAL_DELAY: "5m"

      BACKUP_METHOD: "restic"

      RESTIC_REPOSITORY: "s3:https://f5dbfc5cf299cd799bf49f258675f82b.r2.cloudflarest\
        orage.com/minecraft-backups"

      # Put these secrets in your .env file
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}

      # Voxy Server Side LODs are derived from the region files and rebuilt automatically
      EXCLUDES: "*.jar,cache,logs,*.tmp,vss-lod,.lss"

      # Long-term world: keep a deep history. --keep-tag protects the final
      # snapshot of the old All of Create 1.21.1 world from ever being pruned.
      PRUNE_RESTIC_RETENTION: "--keep-daily 7 --keep-weekly 8 --keep-monthly 24 --keep-tag final-aoc-1.21.1"

      # Hardcode a hostname so Restic doesn't get confused if the container is recreated
      RESTIC_HOSTNAME: "minecraft-smp-server"

    volumes:
      - ./data:/data:ro
