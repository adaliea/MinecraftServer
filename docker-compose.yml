services:
  mc:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    image: itzg/minecraft-server:java25
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
      # Simple Voice Chat (configured to use UDP on the game port)
      - "25565:25565/udp"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      # Pinned: this is a long-term world, bump deliberately after the mods support a new version
      VERSION: "26.3"
      MEMORY: "16G"
      # MeowIce flags crash JDK 25 on this aarch64 (Ampere) host; Aikar G1 flags are safe
      USE_AIKAR_FLAGS: "true"
      TZ: "America/Los_Angeles"
      MOTD: "dacubeking SMP"
      DIFFICULTY: "hard"
      VIEW_DISTANCE: "16"
      SIMULATION_DISTANCE: "10"
      ENTITY_BROADCAST_RANGE_PERCENTAGE: "200"
      SPAWN_PROTECTION: "0"
      ALLOW_FLIGHT: "true"
      SYNC_CHUNK_WRITES: "false"
      ENABLE_WHITELIST: "true"
      ENFORCE_WHITELIST: "true"
      # No Chat Reports strips signatures server-side; don't require signed profiles
      ENFORCE_SECURE_PROFILE: "false"
      ANNOUNCE_PLAYER_ACHIEVEMENTS: "true"
      ENABLE_ROLLING_LOGS: "true"
      # All server-side; vanilla clients can join. Distant Horizons and
      # Simple Voice Chat are optional client installs.
      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
      # Note: DH 3.3.4 deadlocks the very first boot of a NEW world at "Selecting global
      # world spawn". If you ever regenerate the world, remove distanthorizons for the
      # first start, then add it back. Existing worlds start fine.
      # (Comments inside the list below must not contain commas; itzg splits on them.)
      MODRINTH_PROJECTS: |
        fabric-api
        lithium
        ferrite-core
        krypton
        spark
        chunky
        anti-xray
        luckperms
        no-chat-reports
        universal-graves
        distanthorizons
        simple-voice-chat:x9jLR94Q
        styled-chat
        placeholder-api
        ledger
        vanish
        invview
        worldedit
        essential-commands
        # Worldgen (vanilla blocks only; removing later just leaves chunk borders)
        tectonic
        terralith
        nullscape
        amplified-nether
        structory
        towns-and-towers
        dungeons-and-taverns
    volumes:
      - "./data:/data"
  restore-backup:
    profiles:
      - restore
    image: itzg/mc-backup
    restart: "no"
    # Call the native restic tool instead of a helper script
    entrypoint: restic
    # Tell it to restore the latest snapshot to the root directory
    command: restore latest --host minecraft-smp-server --target /
    environment:
      RESTIC_REPOSITORY: "s3:https://f5dbfc5cf299cd799bf49f258675f82b.r2.cloudflarest\
        orage.com/minecraft-backups"
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
    volumes:
      - ./data:/data
  backups:
    image: itzg/mc-backup
    # Without this the sidecar silently stayed dead after exiting in April 2026
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      mc:
        condition: service_healthy
    environment:
      NAME_WITH_VERSION: "true"
      BACKUP_INTERVAL: "6h"
      RCON_HOST: mc
      INITIAL_DELAY: "5m"

      BACKUP_METHOD: "restic"

      RESTIC_REPOSITORY: "s3:https://f5dbfc5cf299cd799bf49f258675f82b.r2.cloudflarest\
        orage.com/minecraft-backups"

      # Put these secrets in your .env file
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}

      # Distant Horizons LODs are regenerable and churn heavily, so don't back them up
      EXCLUDES: "*.jar,cache,logs,*.tmp,DistantHorizons.sqlite*"

      # Long-term world: keep a deep history. --keep-tag protects the final
      # snapshot of the old All of Create 1.21.1 world from ever being pruned.
      PRUNE_RESTIC_RETENTION: "--keep-daily 7 --keep-weekly 8 --keep-monthly 24 --keep-tag final-aoc-1.21.1"

      # Hardcode a hostname so Restic doesn't get confused if the container is recreated
      RESTIC_HOSTNAME: "minecraft-smp-server"

    volumes:
      - ./data:/data:ro
